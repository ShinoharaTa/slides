<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ステージ</title>
<style>
  /* =========================================================
     ステージ: 複数のデッキを 1 つの画面で切り替えて投影する
       stage.html?d=decks/a/slide.html,decks/b/slide.html
     ・各デッキを iframe で持ち、表示を切り替えるだけなので全画面が解除されない
     ・キー 1〜9 でデッキ切り替え。それ以外のキーは表示中のデッキへ転送
     ・「スライドショー」（S）で投影先の画面に全画面、手元に発表者ビューを出す
     ・「発表者」で stage.html#presenter を別ウィンドウに開く。デッキも一緒に切り替わる
       （同じブラウザなら別タブで #presenter を直接開いても BroadcastChannel で連動する）
     ========================================================= */
  html, body { margin: 0; height: 100%; background: #0b1426; overflow: hidden;
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #fff; }
  .stage { position: fixed; inset: 0; }
  .stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: none; background: #0b1426; }
  .stage iframe.active { display: block; }

  /* デッキ切り替えのバー。投影側では薄くしておき、触ると出る */
  .bar {
    position: fixed; left: 16px; bottom: 16px; z-index: 10;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    background: rgba(11, 20, 38, 0.92); backdrop-filter: blur(10px);
    padding: 8px 12px; border-radius: 999px; font-size: 13px;
    opacity: 0.15; transition: opacity 0.2s;
  }
  .bar:hover { opacity: 1; }
  body.presenter .bar { opacity: 1; bottom: auto; top: 12px; }
  .bar button {
    font: inherit; font-size: 13px; color: #fff; background: rgba(255,255,255,0.12);
    border: none; border-radius: 999px; padding: 6px 12px; cursor: pointer; white-space: nowrap;
  }
  .bar button:hover { background: rgba(255,255,255,0.26); }
  .bar button.tab.on { background: #1083fe; }
  .bar button.tab b { opacity: 0.6; margin-right: 6px; font-weight: 700; }
  .bar .sep { width: 1px; height: 18px; background: rgba(255,255,255,0.25); }
  .bar .hint { opacity: 0.6; padding: 0 4px; }

  /* スライドショーの案内。バーの上に出る短いメモと、上端の帯（帯が出ているあいだは画面全体がクリックを受ける） */
  .show-note {
    position: fixed; left: 16px; bottom: 64px; z-index: 11;
    background: rgba(11, 20, 38, 0.92); backdrop-filter: blur(10px);
    padding: 8px 14px; border-radius: 999px; font-size: 13px; white-space: nowrap;
    opacity: 0; transform: translateY(6px); pointer-events: none;
    transition: opacity 200ms cubic-bezier(0.23, 1, 0.32, 1), transform 200ms cubic-bezier(0.23, 1, 0.32, 1);
  }
  .show-note.on { opacity: 1; transform: none; }
  .show-band { position: fixed; inset: 0; z-index: 12; cursor: pointer; }
  .show-band[hidden] { display: none; }
  .show-band span {
    display: block; padding: 14px 20px; text-align: center;
    background: #1083fe; font-size: 16px; font-weight: 700;
  }

  .usage { max-width: 720px; margin: 80px auto; padding: 0 24px; font-size: 16px; line-height: 1.9; }
  .usage code { background: rgba(255,255,255,0.12); padding: 2px 6px; border-radius: 4px; font-size: 14px; }
</style>
</head>
<body>

<div class="stage" id="stage"></div>
<div class="bar" id="bar"></div>

<script>
  const isPresenter = location.hash === '#presenter';
  const decks = (new URLSearchParams(location.search).get('d') || '')
    .split(',').map((s) => s.trim()).filter(Boolean);

  const stageEl = document.getElementById('stage');
  const bar = document.getElementById('bar');

  if (!decks.length) {
    stageEl.innerHTML = '<div class="usage"><b>stage.html</b> は複数のデッキを 1 画面で切り替えて投影するページです。<br>'
      + 'URL の <code>?d=</code> にデッキのパスをカンマ区切りで渡してください。<br><br>'
      + '<code>stage.html?d=decks/2026-09-bluesky-meetup/mc/slide.html,decks/2026-09-bluesky-meetup/lt/slide.html</code><br><br>'
      + 'index.html の各イベントに「まとめて投影」のリンクがあります。</div>';
    bar.hidden = true;
  }

  // ---- iframe を並べる ----
  const frames = decks.map((src) => {
    const f = document.createElement('iframe');
    f.src = src + (isPresenter ? '#presenter' : '');
    f.addEventListener('load', () => f.contentWindow.postMessage({ type: 'hello' }, '*'));
    stageEl.appendChild(f);
    return f;
  });
  const titles = decks.map((d) => d.split('/').slice(-2, -1)[0] || d);
  let active = 0;
  let presenterWin = null;
  if (isPresenter) document.body.classList.add('presenter');

  // 投影側と発表者側のあいだは postMessage（opener / presenterWin）と BroadcastChannel の両方に流す。
  // key だけは id で重複を捨てる（switch / titles / state は何度来ても同じ結果になる）
  let chan = null;
  if (typeof BroadcastChannel !== 'undefined') {
    try { chan = new BroadcastChannel('stage:' + location.pathname + location.search); } catch (err) { chan = null; }
  }
  const msgSrc = Math.random().toString(36).slice(2);
  let msgSeq = 0;
  const seenKeys = [];
  function seenKey(id) {
    if (!id) return false;
    if (seenKeys.includes(id)) return true;
    seenKeys.push(id);
    if (seenKeys.length > 50) seenKeys.shift();
    return false;
  }

  function renderBar() {
    if (!frames.length) return;
    bar.innerHTML = '';
    frames.forEach((f, i) => {
      const b = document.createElement('button');
      b.className = 'tab' + (i === active ? ' on' : '');
      b.innerHTML = `<b>${i + 1}</b>${titles[i]}`;
      b.addEventListener('click', () => switchTo(i, true));
      bar.appendChild(b);
    });
    const sep = document.createElement('span'); sep.className = 'sep'; bar.appendChild(sep);
    if (!isPresenter) {
      const sh = document.createElement('button'); sh.textContent = 'スライドショー'; sh.title = '投影先に全画面、手元に発表者ビュー (S)';
      sh.addEventListener('click', startShow); bar.appendChild(sh);
      const fs = document.createElement('button'); fs.textContent = '全画面'; fs.title = 'Shift+F';
      fs.addEventListener('click', enterFullscreen); bar.appendChild(fs);
      const pv = document.createElement('button'); pv.textContent = '発表者'; pv.title = 'P';
      pv.addEventListener('click', () => openPresenter()); bar.appendChild(pv);
    }
    const hint = document.createElement('span'); hint.className = 'hint'; hint.textContent = '1〜9 で切り替え';
    bar.appendChild(hint);
  }

  // デッキを切り替える。投影側で切り替えたら発表者側にも伝える
  function switchTo(i, tell) {
    if (i < 0 || i >= frames.length) return;
    active = i;
    frames.forEach((f, j) => f.classList.toggle('active', j === i));
    renderBar();
    if (isPresenter) { if (tell) send({ type: 'key', key: String(i + 1) }); return; }
    frames[i].contentWindow.postMessage({ type: 'hello' }, '*');   // 状態を送り直させる
    toPresenter({ type: 'switch', deck: i });
  }

  // 発表者側 → 投影側
  function send(msg) {
    if (msg.type === 'key' && !msg.id) msg = Object.assign({ id: msgSrc + ':' + (++msgSeq) }, msg);
    if (window.opener) window.opener.postMessage(msg, '*');
    if (chan) chan.postMessage(msg);
  }
  // 投影側 → 発表者側
  function toPresenter(msg) {
    if (presenterWin && !presenterWin.closed) presenterWin.postMessage(msg, '*');
    if (chan) chan.postMessage(msg);
  }

  // 投影側でのキー処理。数字はデッキ切り替え、それ以外は表示中のデッキへ
  // remote: 発表者ウィンドウから届いたキー（S のスライドショーはこの画面での操作のときだけ）
  function handleKey(key, shift, remote) {
    const k = key.toLowerCase();
    if (!remote && waitFs && !['shift', 'control', 'alt', 'meta'].includes(k)) { armFs(); return; }
    const d = parseInt(key, 10);
    if (!isNaN(d) && String(d) === key && d >= 1 && d <= frames.length) { switchTo(d - 1); return; }
    if (k === 'f' && shift) { enterFullscreen(); return; }
    if (k === 'p') { openPresenterKey(); return; }
    if (k === 's' && !shift && !remote) { startShow(); return; }
    frames[active].contentWindow.postMessage({ type: 'key', key, shiftKey: !!shift }, '*');
  }

  function enterFullscreen() {
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
  }
  function openPresenter(features) {
    presenterWin = window.open(location.href.split('#')[0] + '#presenter', 'stage-presenter', features || 'width=1100,height=680');
    if (!presenterWin) alert('ポップアップがブロックされました。許可してからもう一度押してください。');
  }

  // ---- スライドショー（投影先に全画面 + 手元に発表者ビュー）----
  // Window Management API（Chrome / Edge）で画面の並びがわかれば 1 回で両方を出す。
  // わからないときは発表者ビューだけ開き、この画面に「プロジェクタへ移して全画面に」の帯を出す
  let screens = null;      // getScreenDetails() の結果。許可済みのときだけ持つ
  let homeScreen = null;   // スライドショーを始めたときに手元だった画面
  let showWin = null;      // スライドショーで開いた発表者ウィンドウ。全画面を抜けたら閉じる
  let showFs = false;
  let waitFs = false;
  let showNote = null, showBand = null, noteTimer = 0;
  function keepScreens(d) {
    screens = d;
    d.onscreenschange = () => { window.getScreenDetails().then(keepScreens).catch(() => {}); };
  }
  if (!isPresenter && window.getScreenDetails && navigator.permissions) {
    try {
      navigator.permissions.query({ name: 'window-management' })
        .then((st) => { if (st.state === 'granted') return window.getScreenDetails().then(keepScreens); })
        .catch(() => {});
    } catch (err) { /* window-management を知らないブラウザ */ }
  }
  function winRect(s) { return `left=${s.availLeft},top=${s.availTop},width=${s.availWidth},height=${s.availHeight}`; }
  function noteShow(text) {
    if (!showNote) { showNote = document.createElement('div'); showNote.className = 'show-note'; document.body.appendChild(showNote); }
    showNote.textContent = text;
    requestAnimationFrame(() => showNote.classList.add('on'));
    clearTimeout(noteTimer);
    noteTimer = setTimeout(() => showNote.classList.remove('on'), 4000);
  }
  function startShow() {
    if (isPresenter) return;
    if (screen.isExtended === false) { enterFullscreen(); return; }
    if (screens && screens.screens.length >= 2) {
      const cur = screens.currentScreen;
      const others = screens.screens.filter((s) => s !== cur);
      const target = others.find((s) => s.isInternal === false) || others[0];
      homeScreen = cur;
      // 全画面 → ポップアップの順で、あいだに await を挟まない
      const el = document.documentElement;
      showFs = true;
      if (el.requestFullscreen) el.requestFullscreen({ screen: target }).catch(() => { showFs = false; });
      openPresenter(winRect(cur));
      showWin = presenterWin;
      return;
    }
    if (window.getScreenDetails && !screens) {
      window.getScreenDetails()
        .then((d) => { keepScreens(d); noteShow('もう一度押すと開始します'); })
        .catch(() => showFallback());
      return;
    }
    showFallback();
  }
  function showFallback() {
    openPresenter();
    if (!presenterWin) return;
    showWin = presenterWin;
    waitFs = true;
    if (!showBand) {
      showBand = document.createElement('div'); showBand.className = 'show-band';
      showBand.innerHTML = '<span>このウィンドウをプロジェクタへ移し、F キーかクリックで全画面</span>';
      showBand.addEventListener('click', armFs);
      document.body.appendChild(showBand);
    }
    showBand.hidden = false;
  }
  // 帯が出ているあいだの次のキー / クリックで全画面にする（そのキー本来の操作はさせない）
  function armFs() {
    if (!waitFs) return;
    waitFs = false;
    if (showBand) showBand.hidden = true;
    showFs = true;
    enterFullscreen();
  }
  document.addEventListener('fullscreenchange', () => {
    if (document.fullscreenElement || !showFs) return;
    showFs = false;
    if (showWin && !showWin.closed) showWin.close();
    showWin = null;
  });
  // 全画面中の P は、画面の並びがわかれば手元の画面に開く
  function openPresenterKey() {
    if (document.fullscreenElement && screens) openPresenter(winRect(homeScreen || screens.currentScreen));
    else openPresenter();
  }

  window.addEventListener('message', (e) => {
    const m = e.data || {};
    const idx = frames.findIndex((f) => f.contentWindow === e.source);
    if (idx >= 0) {
      // 自分の iframe から
      if (m.type === 'state') {
        if (m.title) titles[idx] = m.title.split(' - ')[0];
        renderBar();
        if (!isPresenter) {
          toPresenter({ type: 'titles', titles });
          if (idx === active) toPresenter(Object.assign({}, m, { deck: idx }));
        }
      } else if (m.type === 'key') {
        // iframe 内にフォーカスがあるときのキー。投影側なら自分で処理、発表者側なら投影側へ
        if (isPresenter) send(m); else handleKey(m.key, m.shiftKey);
      } else if (isPresenter && m.type === 'hello') {
        send(m);
      }
      return;
    }
    fromPeer(m, e.source);
  });

  // 相手のウィンドウから（source はチャンネル経由のとき null。そのときは presenterWin を書き換えない）
  function fromPeer(m, source) {
    m = m || {};
    if (!isPresenter) {
      // 発表者ウィンドウから
      if (m.type === 'hello') {
        if (source) presenterWin = source;
        toPresenter({ type: 'titles', titles });
        toPresenter({ type: 'switch', deck: active });
        frames[active].contentWindow.postMessage({ type: 'hello' }, '*');
      }
      else if (m.type === 'key') { if (!seenKey(m.id)) handleKey(m.key, m.shiftKey, true); }
    } else {
      // 投影側（opener）から
      if (m.type === 'switch') switchTo(m.deck, false);
      else if (m.type === 'titles') { m.titles.forEach((t, i) => { titles[i] = t; }); renderBar(); }
      else if (m.type === 'state') {
        if (m.deck != null && m.deck !== active) switchTo(m.deck, false);
        frames[active].contentWindow.postMessage(m, '*');
      }
    }
  }
  if (chan) chan.onmessage = (e) => fromPeer(e.data, null);

  document.addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (['ArrowRight', 'ArrowLeft', ' ', 'PageDown', 'PageUp'].includes(e.key)) e.preventDefault();
    if (isPresenter) { send({ type: 'key', key: e.key, shiftKey: e.shiftKey }); return; }
    handleKey(e.key, e.shiftKey);
  });

  if (frames.length) switchTo(0, false);
  if (isPresenter) send({ type: 'hello' });
  // 投影側を再読み込みしても止まらないよう、3 秒ごとに hello を送り直して状態をもらう
  if (isPresenter) setInterval(() => send({ type: 'hello' }), 3000);
</script>

</body>
</html>
